name: Bestimmten Tag exportieren

on:
  workflow_dispatch:
    inputs:
      day1:
        description: 'Datum. Format: 2026-10-30'
        required: true
        default: '2026-10-01'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
      - name: Cache python packages
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ env.pythonLocation }}-${{ runner.os }}-pip-${{ hashFiles('./requirements.txt') }}
      - name: Install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt
      - name: Run python scripts
        run: |
          python ./src/get-day.py ${{ inputs.day1 }}
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Autorun
          file_pattern: '*.csv'